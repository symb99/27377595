<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATI[UCV]Log 2026-1</title>
    <link rel="icon" sizes="32x32" href="icon/cropped-logonuevo-32x32.png"> 
    <link rel="icon" sizes="192x192" href="icon/cropped-logonuevo-192x192.png"> 

    <link rel="stylesheet" href="css/_theme.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box; 
        }

        html{
            width: 100%;
            overflow-x: hidden; 
        }

        body {
            background-color: var(--grey-50);
            font-family: var(--primary-font);
            width: 100%;
            overflow-x: hidden;
        }

        header {
            background-color: var(--main-color);
            padding: 15px 50px;
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--white);
        }

        .UCV {
            font-size: 1rem; 
            vertical-align: middle;
        }

        .logo h1 {
            font-size: 3rem;
            font-weight: bold;
            font-family: var(--flex-font);
        }

        .logo span {
            font-size: 1.1rem;
            vertical-align: middle;
            font-weight: normal;
            font-family: var(--primary-font);
            
        }

        .busqueda form {
            display: flex;
        }
        
        .busqueda input {
            padding: 8px 15px;
            border: none;
            border-radius: 12px 0 0 12px;
            width: 250px;
        }

        .busqueda button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 0 12px 12px 0;
            cursor: pointer;
        }

        .user-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--accent-color);
            border-radius: 50%;
            padding: 7px;
        }

        .contenedor {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .titulo {
            font-size: 1.8rem;
            color: var(--grey-800);
            margin-bottom: 30px;
        }

        .estudiantes {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        .card {
            border-radius: 15px;
            overflow: hidden;
            border-bottom: 8px solid var(--main-color); 
        }

        .card-image {
            height: 250px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-info {
            background-color: var(--white);
            padding: 15px;
        }

        .card-info p {
            color: var(--grey-800);
            font-size: 1rem;
        }

        .footer {
            text-align: center;
            padding: 40px 0;
            color: var(--grey-200);
            font-size: 0.85rem;
            border-top: 1px solid var(--grey-200);
            margin-top: 50px;
            font-family: var(--primary-font);
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="nav-item logo">
                <h1>ATI<span class="UCV">[UCV]</span>Log</h1>
            </div>

            <div class="nav-item busqueda">
                <form action="#">
                    <input type="text" placeholder="Nombre..." name="search">
                    <button type="submit">Buscar</button>
                </form>
            </div>

            <div class="nav-item user-icon">
                <img src="icon/userIcon.svg" alt="Usuario" width="32" height="32">
            </div>
        </nav>
    </header>

    <section>
        <div class="contenedor">
            <h2 class="titulo">Semestre 2026-1</h2>

            <section class="estudiantes">
                <div class="card">
                    <div class="card-image"><img src="27377595.jpg" alt="Sofía Marcano"></div>
                    <div class="card-info"><p>Stefany Martínez</p></div>
                </div>
                <div class="card">
                    <div class="card-image"><img src="Dummies/Dummy1.png" alt="Helena Torres"></div>
                    <div class="card-info"><p>Helena Torres</p></div>
                </div>
                <div class="card">
                    <div class="card-image"><img src="Dummies/Dummy2.png" alt="Carlos Blanco"></div>
                    <div class="card-info"><p>Carlos Blanco</p></div>
                </div>
                <div class="card">
                    <div class="card-image"><img src="Dummies/Dummy3.png" alt="Juan Gutierrez"></div>
                    <div class="card-info"><p>Juan Gutierrez</p></div>
                </div>
                <div class="card">
                    <div class="card-image"><img src="Dummies/Dummy4.png" alt="Isabel Contreras"></div>
                    <div class="card-info"><p>Isabel Contreras</p></div>
                </div>
                <div class="card">
                    <div class="card-image"><img src="Dummies/Dummy5.png" alt="Gabriel Vargas"></div>
                    <div class="card-info"><p>Gabriel Vargas</p></div>
                </div>
            </section>
        </div>
    </section>

    <footer class="footer">
        <p>Copyright © 2026 Escuela de computación - ATI. Todos los derechos reservados</p>
    </footer>
    
</body>
</html>
